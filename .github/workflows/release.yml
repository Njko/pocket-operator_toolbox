name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            label: Linux (x64)
          - os: windows-latest
            platform: win
            label: Windows (x64)

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.label }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'corretto'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test
        env:
          JFX_PLATFORM: ${{ matrix.platform }}

      - name: Build fat JAR
        run: ./gradlew shadowJar
        env:
          JFX_PLATFORM: ${{ matrix.platform }}

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: po-toolbox-${{ matrix.platform }}
          path: build/libs/po-toolbox-*-${{ matrix.platform }}.jar

  release:
    needs: build
    runs-on: ubuntu-latest
    name: Create GitHub Release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f -name "*.jar"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/po-toolbox-linux/*.jar
            artifacts/po-toolbox-win/*.jar
          body: |
            ## PO-12 Toolbox ${{ github.ref_name }}

            Application desktop pour créer et gérer des patterns pour le Pocket Operator PO-12.

            ### Téléchargement

            | Plateforme | Fichier |
            |------------|---------|
            | Linux (x64) | `po-toolbox-*-linux.jar` |
            | Windows (x64) | `po-toolbox-*-win.jar` |

            ### Prérequis
            - **Java 21+** installé ([Télécharger](https://adoptium.net/))

            ### Lancement
            ```bash
            java --add-opens java.base/java.lang=ALL-UNNAMED --add-opens java.base/java.lang.reflect=ALL-UNNAMED -jar po-toolbox-*.jar
            ```
